<!doctype html><html lang="ko"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="leaflet.css"><style>html,body{width:100%;height:100%;margin:0;background:#e4dcd3}#map{position:fixed;inset:0;width:100%;height:100vh;background:#e4dcd3}.car{border-radius:50%;background:#002c5f;border:3px solid white;box-shadow:0 1px 5px #333}</style></head><body><div id="map"></div><script src="leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false,attributionControl:true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let routeLayer=null;
window.showRoute=function(points,stops){ if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.featureGroup();const line=L.polyline(points,{color:'#002c5f',weight:9,opacity:.95}).addTo(routeLayer);L.polyline(points,{color:'#00aad2',weight:5}).addTo(routeLayer);L.circleMarker(points[0],{radius:8,color:'#fff',weight:3,fillColor:'#002c5f',fillOpacity:1}).bindTooltip('시연 출발 위치').addTo(routeLayer);(stops||[]).forEach(function(p,i){if(Number.isFinite(p.latitude)&&Number.isFinite(p.longitude)){const label=document.createElement('span');label.textContent='경유 '+(i+1)+' · '+p.name;L.circleMarker([p.latitude,p.longitude],{radius:9,color:'#fff',weight:3,fillColor:'#e87329',fillOpacity:1}).bindTooltip(label,{permanent:true,direction:'top'}).addTo(routeLayer)}});L.circleMarker(points[points.length-1],{radius:8,color:'#002c5f',weight:3,fillColor:'#e4dcd3',fillOpacity:1}).bindTooltip('목적지').addTo(routeLayer);routeLayer.addTo(map);map.fitBounds(line.getBounds(),{padding:[50,50]});};
map.setView([37.55,127.4],9);
window.resizeMap=function(height){document.getElementById('map').style.height=height+'px';map.invalidateSize();};
</script></body></html>
