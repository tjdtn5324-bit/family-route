<!doctype html><html lang="ko"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="leaflet.css"><style>html,body{width:100%;height:100%;margin:0;background:#e4dcd3}#map{position:fixed;inset:0;width:100%;height:100vh;background:#e4dcd3}.car{border-radius:50%;background:#002c5f;border:3px solid white;box-shadow:0 1px 5px #333}.leaflet-tooltip{font-size:20px;font-weight:700;color:#002c5f;padding:6px 10px}</style></head><body><div id="map"></div><script src="leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false,attributionControl:true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let routeLayer=null, routeSignature=null, vehicleMarker=null;
window.showVehicle=function(p){if(!p){if(vehicleMarker){map.removeLayer(vehicleMarker);vehicleMarker=null;}return;}if(!vehicleMarker){vehicleMarker=L.circleMarker(p,{radius:11,color:"#fff",weight:4,fillColor:"#00aad2",fillOpacity:1}).bindTooltip("현재 차량 위치 · Pleos").addTo(map);}else vehicleMarker.setLatLng(p);};
window.showRoute=function(points,stops){const signature=JSON.stringify([points,stops]);if(signature===routeSignature)return;routeSignature=signature; if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.featureGroup();const line=L.polyline(points,{color:'#002c5f',weight:9,opacity:.95}).addTo(routeLayer);L.polyline(points,{color:'#00aad2',weight:5}).addTo(routeLayer);L.circleMarker(points[0],{radius:8,color:'#fff',weight:3,fillColor:'#002c5f',fillOpacity:1}).bindTooltip('출발 위치').addTo(routeLayer);(stops||[]).forEach(function(p,i){if(Number.isFinite(p.latitude)&&Number.isFinite(p.longitude)){const label=document.createElement('span');label.textContent='경유 '+(i+1)+' · '+p.name;L.circleMarker([p.latitude,p.longitude],{radius:9,color:'#fff',weight:3,fillColor:'#e87329',fillOpacity:1}).bindTooltip(label,{permanent:true,direction:'top'}).addTo(routeLayer)}});L.circleMarker(points[points.length-1],{radius:8,color:'#002c5f',weight:3,fillColor:'#e4dcd3',fillOpacity:1}).bindTooltip('목적지').addTo(routeLayer);routeLayer.addTo(map);map.fitBounds(line.getBounds(),{paddingTopLeft:[Math.min(780,window.innerWidth*0.45),70],paddingBottomRight:[80,150]});};
// 왼쪽 메뉴와 여행 카드가 지도를 가리므로 경로를 그 오른쪽에 맞춘다(위의 왼쪽 여백).
window.setLocked=function(locked){for(const h of [map.dragging,map.touchZoom,map.doubleClickZoom,map.scrollWheelZoom,map.boxZoom,map.keyboard]){if(!h)continue;if(locked)h.disable();else h.enable();}};
map.setView([37.55,127.4],9);
window.clearRoute=function(){if(routeLayer){map.removeLayer(routeLayer);routeLayer=null;routeSignature=null;}if(vehicleMarker){map.setView(vehicleMarker.getLatLng(),13);}else if(!map._familyInitialView){map.setView([37.55,127.4],9);map._familyInitialView=true;}};
window.resizeMap=function(height){document.getElementById('map').style.height=height+'px';map.invalidateSize();};
</script></body></html>
