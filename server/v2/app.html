<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>아빠어디가</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='24' fill='%23002c5f'/%3E%3Cpath d='M16 34V25a6 6 0 0 1 6-6h10m-5-6 6 6-6 6' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* 색: 남색(#002C5F)을 주 색으로, 밝은 파랑(#00AAD2)을 강조로 쓴다. 바탕은 흰색, 입력칸은 옅은 회색. */
:root{--primary:#002c5f;--primary2:#0b3f7a;--accent:#00aad2;--text:#0b1f35;--sub:#6b7785;--line:#e6eaef;--field:#f4f6f8;--bg:#ffffff;--soft:#eef4f9;--ok:#0a7a55;--okbg:#e5f6ef;--bad:#c0392b;--badbg:#fdeeec;--warn:#8a5a00;--warnbg:#fff4dd}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:auto}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1{font-size:28px;line-height:1.25;letter-spacing:-.02em}
h2{font-size:21px;line-height:1.3;letter-spacing:-.01em}
h3{font-size:18px;line-height:1.35}
.sub{color:var(--sub);font-size:15px}
.wrap{max-width:520px;margin:0 auto;padding:20px 22px calc(110px + env(safe-area-inset-bottom))}
/* 로그인·가입 */
.auth{max-width:420px;margin:0 auto;padding:56px 24px 40px;min-height:100vh;display:flex;flex-direction:column}
.logo{width:64px;height:64px;border-radius:50%;background:var(--primary);display:grid;place-items:center;margin:0 auto 34px;box-shadow:0 6px 20px #002c5f33}
.logo svg{width:34px;height:34px}
.auth h1{margin-bottom:6px}
.auth .sub{margin-bottom:26px}
label{display:block;font-size:15px;font-weight:600;margin:16px 0 8px;color:var(--text)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],textarea,select{width:100%;border:1.5px solid transparent;border-radius:14px;background:var(--field);color:var(--text);font:inherit;padding:15px 16px;min-height:54px;outline:none}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);background:#fff}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--sub);font-size:14px;font-weight:600;padding:10px;min-height:44px}
.field-error{color:var(--bad);font-size:14px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--primary);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer;padding:12px 18px;text-align:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.line{background:#fff;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.soft{background:var(--soft);color:var(--primary)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.small{min-height:44px;font-size:15px;width:auto;padding:8px 14px;border-radius:12px}
.btn svg{width:20px;height:20px}
.mt{margin-top:14px}.mt2{margin-top:24px}
.or{display:flex;align-items:center;gap:12px;color:var(--sub);font-size:14px;margin:22px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.switch{margin-top:auto;padding-top:28px;text-align:center;color:var(--sub);font-size:15px}
.switch button{border:0;background:none;color:var(--primary);font:inherit;font-weight:700;cursor:pointer;padding:6px}
.link{border:0;background:none;color:var(--primary);font:inherit;font-weight:600;cursor:pointer;padding:4px 0}
/* 상단 */
.top{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 22px 10px}
.top-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:44px}
.top .mini{width:34px;height:34px;border-radius:50%;background:var(--primary);display:grid;place-items:center;flex:none}
.top .mini svg{width:19px;height:19px}
.top strong{flex:1;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:var(--soft);color:var(--primary);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;cursor:pointer}
.back svg{width:20px;height:20px}
/* 카드·목록 */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.card.tap{cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;display:block}
.row{display:flex;gap:10px;align-items:center}
.row.wrapx{flex-wrap:wrap}
.row>.btn{flex:1}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--primary);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.gray{background:#f0f2f4;color:var(--sub)}.chip.live{background:var(--primary);color:#fff}
.item{padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}
.item strong{display:block;font-size:17px;overflow-wrap:anywhere}
.quote{background:#fff8f1;border-left:3.5px solid #ff8e53;border-radius:12px;padding:11px 14px;margin-top:8px;font-size:15px;overflow-wrap:anywhere}
/* 인스타 스토리 링 트레이 & 풀스크린 스토리 뷰어 */
.story-tray{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 6px;margin-top:8px;scrollbar-width:none}
.story-tray::-webkit-scrollbar{display:none}
.story-item{flex:none;width:74px;text-align:center;background:none;border:0;padding:0;cursor:pointer;color:var(--text);font:inherit}
.story-ring{width:66px;height:66px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff6b6b 0%,#ff9f43 52%,#ffd166 100%);margin:0 auto 6px;display:grid;place-items:center;position:relative;box-shadow:0 4px 12px #ff6b6b2e}
.story-ring.visited{background:linear-gradient(135deg,#0a7a55 0%,#00aad2 100%);box-shadow:0 4px 12px #00aad229}
.story-ring.all{background:linear-gradient(135deg,#002c5f 0%,#00aad2 50%,#ff8e53 100%)}
.story-inner{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;overflow:hidden;border:2px solid #fff}
.story-inner img{width:100%;height:100%;object-fit:cover}
.story-badge{position:absolute;right:-2px;bottom:-2px;background:#fff;border-radius:999px;padding:1px 5px;font-size:12px;box-shadow:0 2px 6px #0002}
.story-label{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ready-card{background:linear-gradient(135deg,#fff8f0 0%,#eef7ff 100%);border:1.5px solid #ffd8b8;border-radius:18px;padding:16px 18px;margin-top:14px}
.ready-card.done{background:linear-gradient(135deg,#e8f8f1 0%,#eef7ff 100%);border-color:#9fe0c6}
.react-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.react-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.react-chip.on{background:#fff0ec;border-color:#ff6b6b;color:#c0392b}
.mood-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mood-btn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.mood-btn.on{background:#fff4ec;border-color:#ff8e53;color:#b34700}
#storyModal{background:#101928;color:#fff;width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;overflow:hidden}
.st-wrap{position:relative;width:100%;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(165deg,#16243b 0%,#2b1d38 55%,#4a2535 100%);background-size:cover;background-position:center}
.st-bars{display:flex;gap:5px;z-index:2}
.st-bar{flex:1;height:3.5px;background:#ffffff40;border-radius:99px;overflow:hidden}
.st-bar>span{display:block;height:100%;background:#fff;width:0%;transition:width .15s linear}
.st-head{display:flex;align-items:center;gap:10px;margin-top:12px;z-index:2}
.st-avatar{width:42px;height:42px;border-radius:50%;background:#ffffff24;display:grid;place-items:center;font-size:22px}
.st-card{background:#0b1524cc;backdrop-filter:blur(10px);border:1px solid #ffffff26;border-radius:22px;padding:20px;z-index:2;margin:auto 0}
.st-foot{z-index:2}
.empty{text-align:center;color:var(--sub);padding:26px 8px}
.empty svg{width:42px;height:42px;stroke:#b7c1cc;margin-bottom:8px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
.seg{display:flex;background:var(--field);border-radius:14px;padding:4px;gap:4px;margin-top:18px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;min-height:46px;font:inherit;font-weight:700;font-size:15px;color:var(--sub);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--primary);box-shadow:0 1px 4px #0b1f3518}
.steps{list-style:none;margin:6px 0 0;padding:0}
.steps li{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.dot{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);color:var(--primary)}
.dot.end{background:var(--primary);color:#fff}.dot.start{background:#fff;box-shadow:inset 0 0 0 2px var(--line);color:var(--sub)}.dot.done{background:var(--okbg);color:var(--ok)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.photos button{aspect-ratio:1;border:0;border-radius:12px;overflow:hidden;background:var(--field);padding:0;color:var(--sub);font:inherit;font-size:13px;cursor:pointer}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .add{display:grid;place-items:center;align-content:center;gap:2px;box-shadow:inset 0 0 0 1.5px var(--line);background:#fff;color:var(--primary);font-weight:700}
.photos .add svg{width:24px;height:24px}
.stat{display:flex;gap:16px;margin-top:10px;color:var(--sub);font-size:14px}
.stat b{color:var(--text)}
/* 하단 메뉴 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs-in{max-width:520px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:transparent;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#94a0ad;font:inherit;font-size:13px;font-weight:700;cursor:pointer;border-radius:12px}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--primary)}
/* 시트·알림 */
dialog{border:0;padding:0;color:var(--text);background:#fff;max-width:520px;width:100%}
dialog::backdrop{background:#0b1f3566}
#sheet{margin:auto auto 0;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:6px 22px calc(24px + env(safe-area-inset-bottom))}
.sheet-head{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:10px;padding:16px 0 8px;z-index:1}
.sheet-head h2{flex:1}
#viewer{background:#000;width:100vw;height:100vh;max-width:none;max-height:none;margin:0}
#viewer img{width:100%;height:calc(100% - 90px);object-fit:contain}
#viewer .bar{height:90px;display:flex;align-items:center;gap:10px;padding:0 18px;color:#fff}
#toast{position:fixed;inset:auto;margin:0;border:0;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 32px);width:max-content;background:#0b1f35;color:#fff;border-radius:14px;padding:13px 18px;font-weight:600;font-size:15px;box-shadow:0 8px 24px #0b1f3540;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--text);margin-top:12px}
.note.warn{background:var(--warnbg);color:var(--warn)}.note.bad{background:var(--badbg);color:var(--bad)}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--field);margin-top:10px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--primary);flex:none}
.radio{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:12px;background:var(--field);margin-top:8px;cursor:pointer;font-weight:600}
.radio:has(input:checked){background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--primary)}
.radio input{accent-color:var(--primary);width:18px;height:18px}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="tabs-in" id="tabsIn"></div></nav>
<dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="back" type="button" id="sheetClose" aria-label="닫기"></button></div><div id="sheetBody"></div></dialog>
<dialog id="viewer" aria-label="사진 크게 보기"><img id="viewerImg" alt=""><div class="bar"><span id="viewerWho" class="grow"></span><button class="btn small danger" id="viewerDel" type="button" hidden>삭제</button><button class="btn small soft" id="viewerClose" type="button">닫기</button></div></dialog>
<div id="toast" popover="manual" role="status" aria-live="polite"></div>
<script>
'use strict';
// ───────── 공용 도구 ─────────
const $ = id => document.getElementById(id);
const ICON = {
  logo: '<path d="M7 19v-6a4 4 0 0 1 4-4h7m-4-4 4 4-4 4" stroke="#fff" stroke-width="2.6"/>',
  trip: '<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  album: '<rect x="3" y="5" width="18" height="15" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="9.5" r="1.3"/>',
  family: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M16 14.3c2.8.2 5 2.6 5 5.7"/>',
  back: '<path d="m15 5-7 7 7 7"/>', close: '<path d="M6 6l12 12M18 6 6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>', share: '<path d="M12 15V4m0 0L8 8m4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
  car: '<path d="M4 16v-3l2-5.5A2 2 0 0 1 7.9 6h8.2a2 2 0 0 1 1.9 1.5L20 13v3"/><rect x="3" y="13" width="18" height="5" rx="1.5"/>', flag: '<path d="M6 21V4m0 1h11l-2.5 4L17 13H6"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'
};
const svg = (name, extra = '') => { const s = document.createElement('span'); s.style.display = 'contents'; s.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICON[name]}</svg>`; return s.firstChild; };
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) e.append(kid);
  return e;
}
let toastTimer;
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : ''); try { if (t.matches(':popover-open')) t.hidePopover(); t.showPopover(); } catch {} clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; try { t.hidePopover(); } catch {} }, Math.max(3500, msg.length * 90)); }
/** 누르는 동안 잠그고, 실패하면 이유를 알려 주는 버튼 */
function btn(label, fn, cls = '', icon) {
  const b = h('button', { class: 'btn ' + cls, type: 'button' }, icon ? svg(icon) : null, label);
  b.addEventListener('click', async () => { if (b.disabled) return; b.disabled = true; try { await fn(b); } catch (e) { if (e.message) toast(e.message, true); } finally { b.disabled = false; } });
  return b;
}
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) : '날짜 미정';
const fmtDay = ms => new Date(ms).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
const km = m => m >= 1000 ? (m / 1000).toFixed(m >= 100000 ? 0 : 1) + 'km' : m + 'm';
const mins = s => { const m = Math.round(s / 60); return m >= 60 ? Math.floor(m / 60) + '시간 ' + (m % 60) + '분' : m + '분'; };
function eul(w) { const c = w.charCodeAt(w.length - 1); return w + (c >= 0xac00 && c <= 0xd7a3 ? ((c - 0xac00) % 28 ? '을' : '를') : '을(를)'); }

// ───────── 서버 호출 ─────────
// 로그인 정보는 브라우저가 HttpOnly 쿠키로만 보관한다. 이 화면의 스크립트는 세션 값을 알지 못하고, 가족 자료를 기기에 저장하지 않는다.
async function api(path, { method, data, big } = {}) {
  let r;
  try { r = await fetch(path, { method: method || (data ? 'POST' : 'GET'), credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: data ? JSON.stringify(data) : undefined, signal: AbortSignal.timeout(big ? 20000 : 10000) }); }
  catch { throw Error('연결이 느리거나 끊겼어요. 잠시 후 다시 시도해 주세요.'); }
  let body = {}; try { body = await r.json(); } catch {}
  if (r.status === 401 && !path.startsWith('/api/auth/')) { resetToLogin(body.error || '로그인이 끝났어요. 다시 로그인해 주세요.'); throw Error(''); }
  if (!r.ok) throw Error(body.error || '잠시 문제가 생겼어요. 다시 시도해 주세요.');
  return body;
}

// ───────── 상태와 화면 전환 ─────────
// 화면 상태는 메모리에만 있다. 로그아웃하면 페이지를 새로 불러 전부 비운다.
const S = { me: null, tab: 'trips', view: null, trips: [], trip: null, tripTab: 'ideas', album: [], pendingInvite: new URLSearchParams(location.search).get('invite') || new URLSearchParams(location.hash.slice(1)).get('invite') || '' };
let pollTimer = 0;
function clearUrl() { if (location.search || location.hash) history.replaceState(null, '', '/'); }
function resetToLogin(message) { S.me = null; clearInterval(pollTimer); renderAuth('login', message); }
function setTabs(show) {
  $('tabs').hidden = !show; if (!show) return;
  const tabs = [['trips', '여행', 'trip'], ['courses', '추천 코스', 'compass'], ['album', '추억 앨범', 'album'], ['family', '우리 가족', 'family']];
  $('tabsIn').replaceChildren(...tabs.map(([key, label, icon]) => { const b = h('button', { type: 'button', 'aria-current': S.tab === key && !S.view ? 'page' : null }, svg(icon), label); b.onclick = () => go(key); return b; }));
}
function topBar(title, onBack) {
  const bar = h('header', { class: 'top' }, h('div', { class: 'top-in' }, onBack ? h('button', { class: 'back', type: 'button', 'aria-label': '뒤로', onclick: onBack }, svg('back')) : h('span', { class: 'mini' }, svg('logo', 'stroke-width="2.6"')), h('strong', { text: title })));
