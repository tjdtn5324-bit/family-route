<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>여행 코스 | 가족경로</title>
<style>
:root{color-scheme:light;--navy:#002c5f;--ink:#173651;--sand:#f6f3f2;--line:#cbd6dc;--blue:#006d8c}*{box-sizing:border-box}body{margin:0;background:var(--sand);color:var(--navy);font:18px/1.55 system-ui,-apple-system,sans-serif}main{width:min(100% - 36px,720px);margin:auto;padding:22px 0 60px}a{color:var(--navy)}.back{display:inline-flex;align-items:center;min-height:48px;font-weight:700;text-decoration:none}.hero{overflow:hidden;margin:12px 0 22px;background:#fff;border-radius:20px;box-shadow:0 4px 24px #002c5f12}.hero img{width:100%;height:190px;object-fit:cover;display:block}.hero-copy{padding:22px}.eyebrow{color:var(--blue);font-size:15px;letter-spacing:.08em;font-weight:800}.hero h1{font-size:32px;line-height:1.2;margin:6px 0 10px}.hero p{margin:0;color:var(--ink)}.image-note{font-size:13px!important;margin-top:8px!important}.panel{background:#fff;border-radius:18px;padding:22px;margin:16px 0}h2{font-size:24px;line-height:1.3;margin:0 0 8px}p{margin:8px 0}.muted{color:#405a70;font-size:16px}label{display:block;font-weight:700}input,button{font:inherit;border-radius:10px}input{width:100%;min-height:56px;padding:12px;border:2px solid #a7b7c5;margin:6px 0 10px;color:var(--navy)}button{min-height:56px;padding:12px 18px;color:white;background:var(--navy);border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #00aad2;outline-offset:3px}.search-row{display:flex;gap:10px;align-items:center}.search-row input{margin:0;flex:1;min-width:0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{min-height:42px;background:#e7f1f4;color:var(--navy);padding:8px 15px;border-radius:999px}.card{background:#fff;border-radius:18px;margin:14px 0;padding:22px;box-shadow:0 3px 16px #002c5f0b}.card h3{font-size:22px;line-height:1.3;margin:8px 0}.tag{display:inline-block;color:#005a72;background:#e3f3f4;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:700}.sample{background:#fff1d7;color:#774900}.route{margin:14px 0;padding-left:24px;color:var(--ink)}.route li{padding:3px 0}.notice{font-weight:700;color:#00664c}.error{color:#a32216;font-weight:700}.card button{width:100%}details summary{font-size:21px;font-weight:700;cursor:pointer;min-height:48px}details .content{padding-top:14px}@media(max-width:400px){main{width:min(100% - 24px,720px)}.hero img{height:155px}.hero h1{font-size:28px}.panel,.card{padding:18px}.search-row{flex-direction:column;align-items:stretch}}
</style></head><body><main>
<a class="back" href="/">← 가족방으로 돌아가기</a>
<header class="hero"><img src="/assets/busan-illustration.png" alt="부산 바다와 다리를 그린 여행 일러스트"><div class="hero-copy"><span class="eyebrow">FAMILY ROUTE · TRAVEL GUIDE</span><h1>함께 떠나고 싶은 곳</h1><p>다른 가족의 여행을 천천히 둘러보고, 우리 가족의 길에 담아 보세요.</p><p class="image-note">그림은 분위기를 위한 시연용 일러스트예요.</p></div></header>
<section class="panel"><h2>어디로 떠나세요?</h2><p class="muted">지역이나 장소 이름으로 공유된 여행을 찾아보세요.</p><form id="searchForm"><label for="region">여행할 지역 또는 장소</label><div class="search-row"><input id="region" placeholder="예: 부산" maxlength="80"><button type="submit">코스 찾기</button></div></form><div class="chips"><button class="chip" data-query="부산" type="button">부산 둘러보기</button><button class="chip" data-query="" type="button">전체 보기</button></div><p id="status" role="status" aria-live="polite" class="muted"></p></section>
<section aria-labelledby="resultsTitle"><h2 id="resultsTitle">가족 여행 이야기</h2><p class="muted">장소 순서를 살펴보고 마음에 드는 여행을 골라보세요.</p><div id="results"></div></section>
<section class="panel" id="publishSection" hidden><details><summary>우리 가족 코스 공유하기</summary><div class="content"><p class="muted">현재 가족 경로의 제목과 장소 순서가 다른 이용자에게 공개돼요. 가족방 정보는 공개하지 않아요.</p><form id="publishForm"><label for="title">여행 이름</label><input id="title" maxlength="80" required placeholder="예: 가성비 부산 여행"><label for="description">한 줄 소개 (선택)</label><input id="description" maxlength="300" placeholder="예: 바다도 보고 맛있는 것도 먹어요"><button type="submit">이 코스 공개하기</button></form><p id="publishStatus" class="muted" role="status"></p></div></details></section>
</main><script>
const $=id=>document.getElementById(id);const token=sessionStorage.getItem('family-route-member')||'';
function el(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e}
async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:data?JSON.stringify(data):undefined});const body=await r.json();if(!r.ok)throw Error(body.error||'잠시 후 다시 시도해 주세요.');return body}
async function loadCourses(q=''){const status=$('status'),box=$('results');status.textContent='여행을 찾고 있어요.';box.replaceChildren();try{const result=await api('/api/public/courses?q='+encodeURIComponent(q));status.textContent=result.courses.length?result.courses.length+'개의 여행을 찾았어요.':'아직 이 지역에 공유된 코스가 없어요.';for(const c of result.courses){const card=el('article','', 'card');card.append(el('span',c.sample?'시연 예시':'가족이 공유한 코스','tag'+(c.sample?' sample':'')),el('h3',c.title),el('p',c.description||'가족과 함께 둘러보는 여행이에요.','muted'));if(c.sample)card.append(el('p','시연을 위한 예시이며 실제 이용자 후기가 아니에요.','muted'));const route=el('ol','', 'route');for(const p of [...c.waypoints,c.destination])route.append(el('li',p.name));card.append(route);const info=el('p','선택하면 장소들을 우리 가족 경로의 경유지로 제안해요. 목적지는 그대로예요.','muted');card.append(info);if(token){const b=el('button','우리 가족에게 제안하기');b.onclick=async()=>{b.disabled=true;try{await api('/api/courses/'+encodeURIComponent(c.id)+'/propose','POST',{});info.textContent='가족에게 제안했어요. 차량에서 확인해 주세요.';info.className='notice'}catch(e){info.textContent=e.message;info.className='error'}finally{b.disabled=false}};card.append(b)}else{const link=el('a','가족방에 참여하고 코스 제안하기');link.href='/';card.append(link)}box.append(card)}}catch(e){status.textContent='여행을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';status.className='error'}}
$('searchForm').onsubmit=e=>{e.preventDefault();$('status').className='muted';loadCourses($('region').value.trim())};document.querySelectorAll('[data-query]').forEach(b=>b.onclick=()=>{$('region').value=b.dataset.query;$('status').className='muted';loadCourses(b.dataset.query)});
if(token){api('/api/state').then(s=>{if(s.itinerary)$('publishSection').hidden=false}).catch(()=>{})}
$('publishForm').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{await api('/api/courses','POST',{title:$('title').value,description:$('description').value});$('publishStatus').textContent='코스를 공개했어요.';$('title').value='';$('description').value='';await loadCourses('')}catch(err){$('publishStatus').textContent=err.message}finally{b.disabled=false}};
loadCourses();
</script></body></html>
